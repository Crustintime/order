<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order | Crust In Time</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site" id="site-header">
    <div id="logo-slot"></div>
    <h1 id="site-name">Crust In Time</h1>
    <p class="sub" id="menu-title">Breads &amp; baked goods</p>
  </header>

  <main class="wrap" id="app">
    <p class="muted center">Loading menu…</p>
  </main>

  <div class="totalbar noprint" id="totalbar" hidden>
    <div class="totalbar-inner">
      <span><strong id="bar-total">$0.00</strong> <span class="muted" id="bar-count"></span></span>
      <a class="btn small" href="#details">Checkout</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
  (function () {
    const { api, h, fill, money, price, driveImg, payLinks } = Crust;
    const app = document.getElementById('app');
    const bar = document.getElementById('totalbar');

    let menu = null;
    let qty = {};          // "itemId|optionId" -> quantity
    let steppers = {};     // "itemId|optionId" -> { out, minus, plus }
    let sending = false;

    // The work delivery link carries ?d=<key>; the plain link is the pickup form.
    const linkKey = new URLSearchParams(location.search).get('d') || '';

    const keyOf = (item, opt) => item.id + '|' + opt.id;

    async function load() {
      bar.hidden = true;
      fill(app, h('p', { class: 'muted center' }, 'Loading menu…'));
      try {
        const data = await api.getMenu(linkKey);
        menu = data.menu;
        qty = {};
        renderHeader();
        renderForm();
      } catch (e) {
        fill(app, h('div', { class: 'card' },
          h('p', { class: 'error' }, e.message),
          h('button', { class: 'btn secondary', type: 'button', onclick: load }, 'Try again')));
      }
    }

    function renderHeader() {
      document.getElementById('menu-title').textContent = menu.title + (menu.formName ? ' · ' + menu.formName : '');
      document.title = menu.title + ' | Crust In Time';
      const slot = document.getElementById('logo-slot');
      const name = document.getElementById('site-name');
      if (menu.logo) {
        fill(slot, driveImg(menu.logo, { alt: 'Crust In Time', class: 'logo', width: 600, lazy: false }));
        name.classList.add('sr-only');
      } else {
        fill(slot);
        name.classList.remove('sr-only');
      }
    }

    function orderLines() {
      const out = [];
      menu.items.forEach(item => item.options.forEach(opt => {
        const n = qty[keyOf(item, opt)] || 0;
        if (n > 0) out.push({ item, opt, qty: n });
      }));
      return out;
    }

    function totals() {
      const lines = orderLines();
      return {
        lines,
        count: lines.reduce((s, l) => s + l.qty, 0),
        cents: lines.reduce((s, l) => s + Math.round(l.opt.price * 100) * l.qty, 0)
      };
    }

    /* ---------- Order form ---------- */

    function stepsCard() {
      if (!menu.steps || !menu.steps.length) return null;
      return h('section', { class: 'card steps-card' },
        h('h2', { class: 'steps-title' }, 'How to order'),
        h('ol', { class: 'steps' }, menu.steps.map(s => h('li', {}, s))));
    }

    function renderForm() {
      steppers = {};
      const noPickup = menu.pickupMode === 'weekly' && !menu.pickup;

      if (!menu.ordersOpen || noPickup) {
        fill(app, h('div', { class: 'card notice center' },
          menu.ordersOpen ? 'There are no ' + menu.word.toLowerCase() + ' dates open right now. Check back soon!' : menu.closedMessage));
        return;
      }

      const orderable = menu.items.filter(i => i.options.length);
      fill(app,
        menu.intro ? h('p', { class: 'intro' }, menu.intro) : null,
        stepsCard(),
        h('h2', {}, 'Choose your items'),
        orderable.length ? orderable.map(itemCard) : h('p', { class: 'muted' }, 'No items are on the menu right now.'),
        detailsForm()
      );
      update();
    }

    function itemCard(item) {
      return h('section', { class: 'card item' + (item.soldOut ? ' is-soldout' : '') },
        item.image ? driveImg(item.image, { alt: item.name, class: 'item-photo', width: 900 }) : null,
        h('div', { class: 'item-head' },
          h('h3', { class: 'item-name' }, item.name),
          item.soldOut ? h('span', { class: 'badge soldout' }, 'Sold out')
                       : item.badge ? h('span', { class: 'badge' }, item.badge) : null),
        item.description ? h('p', { class: 'desc' }, item.description) : null,
        item.options.map(opt => optionRow(item, opt))
      );
    }

    function optionRow(item, opt) {
      const k = keyOf(item, opt);
      const label = opt.label || 'Each';
      const out = h('output', { 'aria-label': 'Quantity of ' + item.name + ', ' + label }, '0');
      const minus = h('button', { type: 'button', 'aria-label': 'Remove one ' + item.name + ', ' + label,
        onclick: () => change(k, -1) }, '−');
      const plus = h('button', { type: 'button', 'aria-label': 'Add one ' + item.name + ', ' + label,
        disabled: item.soldOut, onclick: () => change(k, 1) }, '+');
      steppers[k] = { out, minus, plus };
      return h('div', { class: 'opt' },
        h('span', { class: 'opt-label' }, label),
        h('span', { class: 'opt-price' }, price(opt.price)),
        h('div', { class: 'stepper' }, minus, out, plus));
    }

    function change(k, delta) {
      qty[k] = Math.max(0, Math.min(99, (qty[k] || 0) + delta));
      update();
    }

    function pickupField() {
      if (menu.pickupMode === 'weekly') {
        return h('div', { class: 'field pickup-box', id: 'pickup-box' },
          h('div', {}, menu.word),
          h('div', { class: 'pickup-date' }, menu.pickup.label),
          h('div', { class: 'hint' }, 'Orders for this ' + menu.word.toLowerCase() + ' close at 11:59 pm on ' + menu.pickup.cutoffLabel + '.'));
      }
      const pickups = menu.pickupOptions || [];
      if (!pickups.length) return null;
      return h('label', { class: 'field' }, 'Pickup',
        h('select', { name: 'pickup', required: true },
          pickups.length > 1 ? h('option', { value: '' }, 'Choose a pickup time…') : null,
          pickups.map(p => h('option', { value: p }, p))));
    }

    function payChoice() {
      if (!menu.allowCash) return null;
      const due = menu.pickupMode === 'weekly' && menu.pickup ? 'pay by 11:59 pm ' + menu.pickup.cutoffLabel : 'pay after ordering';
      const opt = (value, title, hint) => h('label', { class: 'pay-choice' },
        h('input', { type: 'radio', name: 'payment', value, required: true }),
        h('span', {}, h('strong', {}, title), h('span', { class: 'hint' }, hint)));
      return h('fieldset', { class: 'pay-choices' },
        h('legend', {}, 'How will you pay?'),
        opt('app', 'Venmo or Cash App', due),
        opt('cash', 'Cash on delivery', 'pay the exact amount when your order arrives'),
        menu.cashNote ? h('p', { class: 'cash-note' }, menu.cashNote) : null);
    }

    function paymentInfo() {
      const links = payLinks(menu.payments);
      return h('div', {},
        h('h2', {}, 'Payment'),
        h('div', { class: 'card' },
          menu.disclaimer ? h('p', { class: 'disclaimer' }, menu.disclaimer) : null,
          payChoice(),
          links.length ? [
            menu.pickupMode === 'weekly' && menu.pickup && !menu.allowCash
              ? h('p', { style: 'margin:12px 0 0' }, 'Payment is due by ', h('strong', {}, '11:59 pm ' + menu.pickup.cutoffLabel), '.')
              : null,
            h('p', { class: 'muted', style: 'margin:12px 0' },
              'After you place your order, you\'ll get Venmo and Cash App buttons with your exact total.'),
            h('div', { class: 'pay-grid' }, links.map(l => h('div', { class: 'pay-card' },
              l.qr ? driveImg(l.qr, { alt: l.label + ' QR code', class: 'qr', width: 600 }) : null,
              h('div', { class: 'pay-name' }, l.label),
              h('div', { class: 'muted' }, l.handle))))
          ] : null));
    }

    function detailsForm() {
      return h('form', { id: 'details', onsubmit: submit },
        h('h2', {}, 'Your details'),
        h('div', { class: 'card' },
          h('label', { class: 'field' }, 'Name',
            h('input', { type: 'text', name: 'cname', autocomplete: 'name', required: true, maxlength: 80 })),
          h('label', { class: 'field' }, 'Phone',
            h('input', { type: 'tel', name: 'phone', autocomplete: 'tel', required: true, maxlength: 30 })),
          h('label', { class: 'field' }, 'Email ', h('span', { class: 'hint' }, '(optional, for a copy of your order)'),
            h('input', { type: 'email', name: 'email', autocomplete: 'email', maxlength: 120 })),
          pickupField(),
          h('label', { class: 'field' }, 'Notes ', h('span', { class: 'hint' }, '(optional)'),
            h('textarea', { name: 'notes', maxlength: 1000, placeholder: 'Allergies, special requests, etc.' }))
        ),
        h('h2', {}, 'Your order'),
        h('div', { class: 'card', id: 'summary' }),
        paymentInfo(),
        h('p', { class: 'error', id: 'form-error', role: 'alert' }),
        h('button', { class: 'btn block', type: 'submit', id: 'submit-btn' }, 'Place order')
      );
    }

    function update() {
      for (const [k, s] of Object.entries(steppers)) {
        const n = qty[k] || 0;
        s.out.textContent = n;
        s.minus.disabled = n === 0;
      }
      const t = totals();
      const summary = document.getElementById('summary');
      if (summary) {
        fill(summary,
          t.lines.length
            ? [
                t.lines.map(l => h('div', { class: 'summary-line' },
                  h('span', {}, l.qty + ' × ' + l.item.name + (l.opt.label ? ' (' + l.opt.label + ')' : '')),
                  h('span', {}, money(Math.round(l.opt.price * 100) * l.qty / 100)))),
                h('div', { class: 'summary-line summary-total' }, h('span', {}, 'Total'), h('span', {}, money(t.cents / 100)))
              ]
            : h('p', { class: 'muted', style: 'margin:0' }, 'Nothing added yet. Use the + buttons above.')
        );
      }
      document.getElementById('bar-total').textContent = money(t.cents / 100);
      document.getElementById('bar-count').textContent = t.count + (t.count === 1 ? ' item' : ' items');
      bar.hidden = t.count === 0;
      if (t.count > 0) setError('');
    }

    function setError(msg) {
      const el = document.getElementById('form-error');
      if (el) el.textContent = msg;
    }

    async function submit(ev) {
      ev.preventDefault();
      if (sending) return;
      const f = ev.target;
      const t = totals();
      if (!t.count) return setError('Please add at least one item to your order.');
      const customer = {
        name: f.elements.cname.value.trim(),
        phone: f.elements.phone.value.trim(),
        email: f.elements.email.value.trim(),
        pickup: f.elements.pickup ? f.elements.pickup.value : '',
        pickupDate: menu.pickupMode === 'weekly' && menu.pickup ? menu.pickup.date : '',
        payment: f.elements.payment ? f.elements.payment.value : 'app',
        notes: f.elements.notes.value.trim()
      };
      if (menu.allowCash && !customer.payment) return setError('Please choose how you will pay.');
      if (customer.phone.replace(/\D/g, '').length < 10) {
        f.elements.phone.focus();
        return setError('Please enter a phone number with area code.');
      }

      const btn = document.getElementById('submit-btn');
      sending = true;
      btn.disabled = true;
      btn.textContent = 'Sending order…';
      setError('');
      try {
        const res = await api.post({
          action: 'order',
          channel: menu.channel,
          key: linkKey,
          customer,
          lines: t.lines.map(l => ({ itemId: l.item.id, optionId: l.opt.id, qty: l.qty }))
        });
        renderConfirmation(res, customer);
      } catch (e) {
        if (e.code === 'pickup_changed') await refreshPickup();
        setError(e.message);
        btn.disabled = false;
        btn.textContent = 'Place order';
      } finally {
        sending = false;
      }
    }

    // The Wednesday deadline passed while the page was open: show the new date.
    async function refreshPickup() {
      try {
        const data = await api.getMenu(linkKey);
        menu.pickup = data.menu.pickup;
        const box = document.getElementById('pickup-box');
        if (box && menu.pickup) box.replaceWith(pickupField());
      } catch (e) { /* the error message already explains */ }
    }

    /* ---------- After submitting ---------- */

    function summaryText(res, customer) {
      return ['Crust In Time order #' + res.orderNo, 'Name: ' + customer.name,
        res.pickup ? menu.word + ': ' + res.pickup : '',
        res.cash ? 'Payment: cash on delivery. ' + (menu.cashNote || '') : '',
        ...res.lines.map(l => l.qty + ' x ' + l.item + (l.option ? ' (' + l.option + ')' : '') + ' = ' + money(l.total)),
        'Total: ' + money(res.total), menu.disclaimer || ''].filter(Boolean).join('\n');
    }

    function saveCopy(res, customer) {
      const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.share) {
        navigator.share({ title: 'Crust In Time order #' + res.orderNo, text: summaryText(res, customer) }).catch(() => {});
      } else {
        window.print();
      }
    }

    function renderConfirmation(res, customer) {
      bar.hidden = true;
      steppers = {};
      const links = payLinks(menu.payments, res.total, res.orderNo);

      fill(app, h('section', { class: 'card' },
        h('h2', { style: 'margin-top:0' }, 'Thank you, ' + customer.name + '!'),
        h('p', {}, 'Your order ', h('strong', {}, '#' + res.orderNo), ' has been received.'),
        res.pickup ? h('p', {}, menu.word + ': ', h('strong', {}, res.pickup)) : null,
        res.lines.map(l => h('div', { class: 'summary-line' },
          h('span', {}, l.qty + ' × ' + l.item + (l.option ? ' (' + l.option + ')' : '')),
          h('span', {}, money(l.total)))),
        h('div', { class: 'summary-line summary-total' }, h('span', {}, 'Total'), h('span', {}, money(res.total))),

        menu.disclaimer ? h('p', { class: 'disclaimer', style: 'margin-top:18px' }, menu.disclaimer) : null,

        res.cash ? h('div', { class: 'pay-now' },
          h('h3', {}, 'Cash on delivery'),
          h('p', {}, 'Please have ', h('strong', {}, money(res.total)), ' ready when your order is delivered' +
            (res.pickup ? ' on ' + res.pickup : '') + '.'),
          menu.cashNote ? h('p', { class: 'disclaimer' }, menu.cashNote) : null
        ) : null,

        !res.cash && links.length ? h('div', { class: 'pay-now' },
          h('h3', {}, 'Pay ' + money(res.total) + (res.payBy ? ' by 11:59 pm ' + res.payBy : ' now')),
          h('p', { class: 'muted' }, 'Please put ', h('strong', {}, 'order #' + res.orderNo), ' in your payment note.'),
          h('div', { class: 'pay-grid' }, links.map(l => h('div', { class: 'pay-card' },
            l.qr ? driveImg(l.qr, { alt: l.label + ' QR code', class: 'qr', width: 600 }) : null,
            h('a', { class: 'btn block', href: l.url, target: '_blank', rel: 'noopener' }, 'Pay with ' + l.label),
            h('div', { class: 'muted', style: 'margin-top:4px' }, l.handle))))
        ) : null,

        res.emailedCopy
          ? h('p', { class: 'muted' }, 'A copy was emailed to ' + customer.email + '. If you don\'t see it, check your spam folder.')
          : null,
        h('div', { class: 'btn-row noprint' },
          h('button', { class: 'btn secondary', type: 'button', onclick: () => saveCopy(res, customer) }, 'Save a copy'),
          h('button', { class: 'btn', type: 'button', onclick: () => { window.scrollTo(0, 0); load(); } }, 'Start a new order')),
        h('p', { class: 'muted noprint phone-only', style: 'font-size:.9rem' }, 'Tip: you can also take a screenshot of this page.')
      ));
      window.scrollTo(0, 0);
    }

    load();
  })();
  </script>
</body>
</html>
