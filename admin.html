<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Menu editor | Crust In Time</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .toolbar {
      position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .toolbar-inner {
      max-width: 720px; margin: 0 auto; padding: 10px 16px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }
    .toolbar .status { flex: 1; min-width: 160px; font-size: .95rem; }
    .status.dirty { color: var(--danger); font-weight: 650; }
    .item.edit .name-input { font-size: 1.1rem; font-weight: 650; }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row > .grow { flex: 1; }
    label.check { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-weight: 600; cursor: pointer; }
    label.check input { width: 20px; height: 20px; flex: none; }
    .opts-head { margin: 4px 0 6px; font-weight: 600; }
    .opt-edit { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
    .opt-edit input { margin-top: 0; }
    .opt-edit .label-in { flex: 1; }
    .opt-edit .price-wrap { display: flex; align-items: center; gap: 4px; width: 110px; }
    .item-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .item-actions .spacer { flex: 1; }
    .list-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .list-row input { margin-top: 0; flex: 1; }
    .toast {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 30;
      max-width: 92vw; padding: 12px 18px; border-radius: 8px;
      background: #2b2420; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .toast.bad { background: var(--danger); }
    .x { width: 38px; height: 38px; padding: 0; flex: none; }
    .avail { width: 100%; border-collapse: collapse; margin: 2px 0 4px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .avail th, .avail td { padding: 8px 6px; border-top: 1px solid var(--line); text-align: center; font-size: .92rem; }
    .avail thead th { border-top: 0; background: #faf8f6; font-weight: 650; }
    .avail tbody th { text-align: left; font-weight: 600; padding-left: 10px; }
    .avail input { width: 24px; height: 24px; margin: 0; }
    .avail-note { margin: 6px 0 0; color: var(--danger); font-weight: 600; font-size: .92rem; }
    .group-label { font-weight: 600; margin-bottom: 6px; }
    .img-field { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 4px 0 14px; }
    .img-preview {
      width: 140px; min-height: 90px; display: grid; place-items: center; overflow: hidden;
      border: 1px dashed #cfc6be; border-radius: 8px; background: #faf8f6;
    }
    .img-preview img { display: block; width: 100%; height: auto; }
    .img-preview.photo img { aspect-ratio: 16 / 10; object-fit: cover; }
    .img-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .preview-line { margin: 4px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); }
    .sub-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .sub-card h3 { margin: 0 0 10px; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="toolbar-slot"></div>
  <header class="site">
    <h1>Crust In Time</h1>
    <p class="sub">Menu editor</p>
  </header>
  <main class="wrap" id="admin"><p class="muted center">Loading…</p></main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
  (function () {
    const { api, h, fill, driveImg } = Crust;
    const root = document.getElementById('admin');
    const toolbarSlot = document.getElementById('toolbar-slot');
    const PW_KEY = 'crust_admin_pw';

    const S = { pw: null, menu: null, saved: [], dirty: false, defaultEmail: '', sheetUrl: '' };
    const previews = {};   // image id -> local copy, so new uploads show instantly
    const uid = (p) => p + Math.random().toString(36).slice(2, 10);

    function readPw() { try { return sessionStorage.getItem(PW_KEY); } catch (e) { return null; } }
    function writePw(v) {
      try { v ? sessionStorage.setItem(PW_KEY, v) : sessionStorage.removeItem(PW_KEY); } catch (e) {}
    }

    async function adminCall(body) {
      try {
        return await api.post(Object.assign({}, body, { password: S.pw }));
      } catch (e) {
        if (e.code === 'bad_password' || e.code === 'no_password') {
          S.pw = null; writePw(null); S.dirty = false;
          showLogin(e.message);
        }
        throw e;
      }
    }

    let toastTimer;
    function toast(msg, bad) {
      document.querySelectorAll('.toast').forEach(t => t.remove());
      const t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: 'status' }, msg);
      document.body.append(t);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.remove(), bad ? 7000 : 4000);
    }

    /* ---------- Login ---------- */

    function showLogin(message) {
      fill(toolbarSlot);
      const input = h('input', { type: 'password', name: 'pw', autocomplete: 'current-password', required: true });
      const err = h('p', { class: 'error' }, message || '');
      const btn = h('button', { class: 'btn block', type: 'submit' }, 'Open editor');
      fill(root, h('form', { class: 'card', onsubmit: async (ev) => {
          ev.preventDefault();
          btn.disabled = true; btn.textContent = 'Checking…'; err.textContent = '';
          try {
            await loadEditor(input.value);
          } catch (e) {
            err.textContent = e.message;
            btn.disabled = false; btn.textContent = 'Open editor';
          }
        } },
        h('label', { class: 'field' }, 'Admin password', input),
        err, btn));
      input.focus();
    }

    async function loadEditor(pw) {
      const d = await api.post({ action: 'adminLoad', password: pw });
      S.pw = pw; writePw(pw);
      S.menu = d.menu; S.saved = d.saved || []; S.defaultEmail = d.defaultEmail || ''; S.sheetUrl = d.sheetUrl || '';
      S.deliveryKey = d.deliveryKey || '';
      S.dirty = false;
      renderEditor();
    }

    /* ---------- Editor ---------- */

    function markDirty() { S.dirty = true; updateStatus(); }

    function updateStatus() {
      const st = document.getElementById('status');
      const pub = document.getElementById('publish-btn');
      if (!st || !pub) return;
      st.textContent = S.dirty ? 'Unpublished changes' : 'Live menu is up to date';
      st.className = 'status' + (S.dirty ? ' dirty' : '');
      pub.disabled = !S.dirty;
    }

    function renderEditor() {
      const m = S.menu;
      fill(toolbarSlot, h('div', { class: 'toolbar' }, h('div', { class: 'toolbar-inner' },
        h('span', { id: 'status', class: 'status' }),
        h('a', { class: 'btn small secondary', href: 'kitchen.html' }, 'Order board'),
        h('a', { class: 'btn small secondary', href: 'index.html', target: '_blank', rel: 'noopener' }, 'Order page'),
        S.sheetUrl ? h('a', { class: 'btn small secondary', href: S.sheetUrl, target: '_blank', rel: 'noopener' }, 'Orders sheet') : null,
        h('button', { class: 'btn small', id: 'publish-btn', type: 'button', onclick: publish }, 'Publish'),
        h('button', { class: 'btn small secondary', type: 'button', onclick: lock }, 'Lock')
      )));

      fill(root,
        h('h2', {}, 'Order settings'),
        settingsCard(m),
        h('h2', {}, 'Logo and instructions'),
        brandingCard(m),
        h('h2', {}, 'Pickup (public order link)'),
        pickupCard(m),
        h('h2', {}, 'Work delivery (private order link)'),
        deliveryCard(m),
        h('h2', {}, 'Payment'),
        paymentCard(m),
        h('h2', {}, 'Menu items'),
        h('p', { class: 'muted' }, 'Each item card below matches what customers see. Changes go live when you press Publish.'),
        m.items.map(itemEditor),
        h('button', { class: 'btn secondary block', type: 'button', onclick: addItem }, '+ Add item'),
        h('h2', {}, 'Saved menus'),
        savedCard()
      );
      updateStatus();
    }

    // Inputs write straight into the menu object as you type.
    function textIn(obj, prop, attrs) {
      attrs = attrs || {};
      const el = attrs.multiline
        ? h('textarea', { placeholder: attrs.placeholder, class: attrs.class, maxlength: attrs.maxlength })
        : h('input', { type: attrs.type || 'text', placeholder: attrs.placeholder, class: attrs.class,
                       inputmode: attrs.inputmode, maxlength: attrs.maxlength, 'aria-label': attrs.aria });
      el.value = obj[prop] === undefined || obj[prop] === null ? '' : String(obj[prop]);
      el.addEventListener('input', () => { obj[prop] = el.value; markDirty(); if (attrs.onInput) attrs.onInput(); });
      return el;
    }

    function checkIn(obj, prop, label, onChange) {
      const el = h('input', { type: 'checkbox', checked: !!obj[prop] });
      el.addEventListener('change', () => { obj[prop] = el.checked; markDirty(); if (onChange) onChange(el.checked); });
      return h('label', { class: 'check' }, el, label);
    }

    const field = (label, control, hint) =>
      h('label', { class: 'field' }, label, hint ? h('span', { class: 'hint' }, ' ' + hint) : null, control);

    function listEditor(arr, opts) {
      return h('div', {},
        arr.map((v, i) => h('div', { class: 'list-row' },
          textIn(arr, i, { type: opts.type, placeholder: opts.placeholder, maxlength: opts.maxlength,
                           aria: (opts.aria || 'Entry') + ' ' + (i + 1), onInput: opts.onChange }),
          h('button', { class: 'btn small danger x', type: 'button', 'aria-label': 'Remove', title: 'Remove',
            onclick: () => { arr.splice(i, 1); markDirty(); renderEditor(); } }, '×'))),
        h('button', { class: 'btn small secondary', type: 'button', onclick: (ev) => {
          const box = ev.target.parentNode;
          arr.push(''); markDirty(); renderEditor();
          const id = box.id;
          const rows = id ? document.querySelectorAll('#' + id + ' .list-row input') : [];
          if (rows.length) rows[rows.length - 1].focus();
        } }, opts.addLabel));
    }

    function settingsCard(m) {
      return h('section', { class: 'card' },
        field('Menu title', textIn(m, 'title', { maxlength: 100 }), '(shown at the top of the order page)'),
        field('Intro message', textIn(m, 'intro', { multiline: true, maxlength: 1000 }), '(optional)'),
        checkIn(m, 'ordersOpen', 'Taking pickup orders (uncheck to close the pickup form)'),
        field('Message shown when orders are closed', textIn(m, 'closedMessage', { maxlength: 300 })),
        field('Send new orders to', textIn(m, 'notifyEmail', { type: 'email', placeholder: S.defaultEmail, maxlength: 200 }),
          S.defaultEmail ? '(leave blank to use ' + S.defaultEmail + ')' : ''),
        checkIn(m, 'sendCustomerCopy', 'Email customers a copy of their order (when they give an email)'),
        checkIn(m, 'readyEmails', 'Email customers when their order is ready (sent from the order board when the last item is checked off)')
      );
    }

    function brandingCard(m) {
      const steps = listEditor(m.steps, { placeholder: 'e.g. Pick your items', maxlength: 60, aria: 'Step', addLabel: '+ Add step' });
      steps.id = 'steps-list';
      return h('section', { class: 'card' },
        h('div', { class: 'group-label' }, 'Logo ', h('span', { class: 'hint' }, '(shown at the top of the order page and in customer emails)')),
        imageField(m, 'logo', 'logo', 'logo'),
        h('div', { class: 'group-label' }, '"How to order" steps for the pickup form ', h('span', { class: 'hint' }, '(keep each to 3 or 4 words)')),
        steps
      );
    }

    function pickupCard(m) {
      const w = m.weekly;
      const preview = h('p', { class: 'preview-line' });
      const refresh = () => {
        const p = Crust.nextPickup(w);
        preview.textContent = p
          ? 'Right now customers see: pickup ' + p.label + ', orders close 11:59 pm ' + p.cutoffLabel + '.'
          : 'No upcoming pickup date. Check the weeks off list.';
      };
      const mode = (val, label) => {
        const r = h('input', { type: 'radio', name: 'pickupMode', value: val, checked: m.pickupMode === val });
        r.addEventListener('change', () => { m.pickupMode = val; markDirty(); renderEditor(); });
        return h('label', { class: 'check' }, r, label);
      };
      const daySelect = (prop) => {
        const s = h('select', {}, Crust.DAYS.map((d, i) => h('option', { value: String(i) }, d)));
        s.value = String(w[prop]);
        s.addEventListener('change', () => { w[prop] = Number(s.value); markDirty(); refresh(); });
        return s;
      };
      const card = h('section', { class: 'card' },
        mode('weekly', 'Same day every week (date updates automatically)'),
        mode('list', 'Specific dates I type in'));

      if (m.pickupMode === 'weekly') {
        const skips = listEditor(w.skipDates, { type: 'date', aria: 'Week off', addLabel: '+ Add a week off', onChange: refresh });
        skips.id = 'skip-list';
        card.append(
          h('div', { class: 'row' },
            h('div', { class: 'grow' }, field('Pickup day', daySelect('pickupDay'))),
            h('div', { class: 'grow' }, field('Last day to order', daySelect('cutoffDay')))),
          field('Pickup time', textIn(w, 'time', { placeholder: 'e.g. 9am to noon', maxlength: 60, onInput: refresh }), '(optional)'),
          h('div', { class: 'group-label' }, 'Weeks off ', h('span', { class: 'hint' }, '(pickup dates with no baking; orders roll to the next week)')),
          skips,
          preview);
        refresh();
      } else {
        const list = listEditor(m.pickupOptions, { placeholder: 'e.g. Saturday, Dec 20, 9am to noon', maxlength: 120, aria: 'Pickup option', addLabel: '+ Add pickup option' });
        list.id = 'pickup-list';
        card.append(h('div', { class: 'group-label' }, 'Pickup options customers choose from'), list);
      }
      card.append(h('div', { style: 'height:14px' }),
        field('Pickup address', textIn(m, 'pickupAddress', { maxlength: 200, placeholder: 'Street, city, state, ZIP' }),
          '(included in the "your order is ready" email)'));
      return card;
    }

    function deliveryCard(m) {
      const d = m.delivery, w = d.weekly;
      const preview = h('p', { class: 'preview-line' });
      const refresh = () => {
        const p = Crust.nextPickup(w);
        preview.textContent = p
          ? 'Right now coworkers see: delivery ' + p.label + ', orders close 11:59 pm ' + p.cutoffLabel + '.'
          : 'No upcoming delivery date. Check the weeks off list.';
      };
      const daySelect = (prop) => {
        const sel = h('select', {}, Crust.DAYS.map((name, i) => h('option', { value: String(i) }, name)));
        sel.value = String(w[prop]);
        sel.addEventListener('change', () => { w[prop] = Number(sel.value); markDirty(); refresh(); });
        return sel;
      };
      const linkUrl = () => new URL('index.html?d=' + encodeURIComponent(S.deliveryKey), location.href).href;
      const linkInput = h('input', { type: 'text', readonly: true, value: linkUrl(), 'aria-label': 'Work order link' });
      const openLink = h('a', { class: 'btn small secondary', href: linkUrl(), target: '_blank', rel: 'noopener' }, 'Open');
      const copy = () => {
        const done = () => toast('Link copied. Paste it in a text or email to coworkers.');
        if (navigator.clipboard) navigator.clipboard.writeText(linkInput.value).then(done, () => { linkInput.select(); toast('Select the link and copy it.'); });
        else { linkInput.select(); document.execCommand('copy'); done(); }
      };
      const makeNew = async () => {
        if (!confirm('Make a new work link? The current link will stop working right away, so you\'ll need to share the new one.')) return;
        try {
          const r = await adminCall({ action: 'adminNewDeliveryLink' });
          S.deliveryKey = r.deliveryKey;
          linkInput.value = linkUrl(); openLink.href = linkUrl();
          toast('New link ready. The old one no longer works.');
        } catch (e) { toast(e.message, true); }
      };
      const skips = listEditor(w.skipDates, { type: 'date', aria: 'Week off', addLabel: '+ Add a week off', onChange: refresh });
      skips.id = 'delivery-skip-list';
      const steps = listEditor(d.steps, { placeholder: 'e.g. Choose how to pay', maxlength: 60, aria: 'Step', addLabel: '+ Add step' });
      steps.id = 'delivery-steps-list';
      const card = h('section', { class: 'card' },
        checkIn(d, 'enabled', 'Taking delivery orders (uncheck to close the work form)'),
        h('div', { class: 'group-label' }, 'Order link ', h('span', { class: 'hint' }, '(share only with coworkers; same menu as the pickup form)')),
        linkInput,
        h('div', { class: 'btn-row', style: 'margin:8px 0 16px' },
          h('button', { class: 'btn small', type: 'button', onclick: copy }, 'Copy link'),
          openLink,
          h('button', { class: 'btn small danger', type: 'button', onclick: makeNew }, 'Make a new link')),
        h('div', { class: 'row' },
          h('div', { class: 'grow' }, field('Delivery day', daySelect('pickupDay'))),
          h('div', { class: 'grow' }, field('Last day to order', daySelect('cutoffDay')))),
        field('Delivery time', textIn(w, 'time', { placeholder: 'e.g. morning', maxlength: 60, onInput: refresh }), '(optional)'),
        h('div', { class: 'group-label' }, 'Weeks off ', h('span', { class: 'hint' }, '(delivery dates with no baking; orders roll to the next week)')),
        skips,
        preview,
        h('div', { style: 'height:14px' }),
        checkIn(d, 'allowCash', 'Offer cash on delivery (in addition to Venmo and Cash App)'),
        field('Cash on delivery note', textIn(d, 'cashNote', { multiline: true, maxlength: 300 }),
          '(shown when someone picks cash, and repeated in their emails)'),
        field('Delivery disclaimer', textIn(d, 'disclaimer', { multiline: true, maxlength: 400 }),
          '(shown at checkout, after ordering, and in the customer email)'),
        h('div', { class: 'group-label' }, '"How to order" steps for the work form ', h('span', { class: 'hint' }, '(keep each to 3 or 4 words)')),
        steps
      );
      refresh();
      return card;
    }

    function paymentCard(m) {
      const p = m.payments;
      return h('section', { class: 'card' },
        field('Pickup disclaimer', textIn(m, 'disclaimer', { multiline: true, maxlength: 400 }),
          '(shown at checkout, after ordering, and in the customer email; the work form has its own below)'),
        h('div', { class: 'sub-card' }, h('h3', {}, 'Venmo'),
          field('Venmo username', textIn(p.venmo, 'handle', { placeholder: 'e.g. Sarah-Ayers-42', maxlength: 40 }), '(without the @; leave blank to hide Venmo)'),
          h('div', { class: 'group-label' }, 'QR code'),
          imageField(p.venmo, 'qr', 'qr', 'venmo-qr')),
        h('div', { class: 'sub-card' }, h('h3', {}, 'Cash App'),
          field('$Cashtag', textIn(p.cashapp, 'handle', { placeholder: 'e.g. Sayers2014', maxlength: 40 }), '(without the $; leave blank to hide Cash App)'),
          h('div', { class: 'group-label' }, 'QR code'),
          imageField(p.cashapp, 'qr', 'qr', 'cashapp-qr'))
      );
    }

    /* ---------- Image uploads ---------- */

    function imageField(obj, prop, kind, name) {
      const box = h('div', { class: 'img-field' });
      const draw = () => {
        const id = obj[prop];
        const input = h('input', { type: 'file', accept: 'image/*', hidden: true });
        const status = h('span', { class: 'muted' });
        const upBtn = h('button', { class: 'btn small secondary', type: 'button', onclick: () => input.click() },
          id ? 'Replace' : 'Upload');
        input.addEventListener('change', async () => {
          const file = input.files && input.files[0];
          if (!file) return;
          upBtn.disabled = true; status.textContent = 'Uploading…';
          try {
            const img = await prepareImage(file, kind);
            const d = await adminCall({ action: 'adminUploadImage', data: img.base64, mime: img.mime, name });
            previews[d.id] = img.dataUrl;
            obj[prop] = d.id;
            markDirty(); draw();
            toast('Image uploaded. Press Publish to make it live.');
          } catch (e) {
            upBtn.disabled = false; status.textContent = '';
            toast(e.message, true);
          }
        });
        fill(box,
          h('div', { class: 'img-preview ' + kind },
            id ? driveImg(id, { preview: previews[id], width: 600, alt: '' }) : h('span', { class: 'muted' }, 'No image')),
          h('div', { class: 'img-actions' }, upBtn,
            id ? h('button', { class: 'btn small danger', type: 'button',
              onclick: () => { obj[prop] = ''; markDirty(); draw(); } }, 'Remove') : null,
            status, input));
      };
      draw();
      return box;
    }

    // Shrinks photos before uploading. Logos and QR codes stay PNG so they stay sharp.
    function prepareImage(file, kind) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const max = kind === 'photo' ? 1400 : 900;
          const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale));
          const ht = Math.max(1, Math.round(img.naturalHeight * scale));
          const draw = (whiteBg) => {
            const c = document.createElement('canvas');
            c.width = w; c.height = ht;
            const ctx = c.getContext('2d');
            if (whiteBg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, ht); }
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, w, ht);
            return c;
          };
          let mime = kind === 'photo' ? 'image/jpeg' : 'image/png';
          let dataUrl = draw(mime === 'image/jpeg').toDataURL(mime, 0.85);
          if (mime === 'image/png' && dataUrl.length > 3000000) {
            mime = 'image/jpeg';
            dataUrl = draw(true).toDataURL(mime, 0.9);
          }
          resolve({ dataUrl, mime, base64: dataUrl.slice(dataUrl.indexOf(',') + 1) });
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Couldn't read that image. Try a JPG or PNG."));
        };
        img.src = url;
      });
    }

    /* ---------- Menu items ---------- */

    function itemEditor(item, idx) {
      const items = S.menu.items;
      const card = h('section', { class: 'card item edit', id: 'item-' + item.id });
      fill(card,
        h('div', { class: 'group-label' }, 'Photo ', h('span', { class: 'hint' }, '(optional)')),
        imageField(item, 'image', 'photo', item.name || 'item'),
        field('Item name', textIn(item, 'name', { class: 'name-input', maxlength: 100 })),
        field('Badge', textIn(item, 'badge', { placeholder: 'e.g. Last Chance, New', maxlength: 30 }), '(optional)'),
        availability(item, card),
        field('Description', textIn(item, 'description', { multiline: true, maxlength: 1000 })),
        h('div', { class: 'opts-head' }, 'Sizes and prices ', h('span', { class: 'hint' }, '(each line is something customers can add)')),
        item.options.map((opt, oi) => h('div', { class: 'opt-edit' },
          textIn(opt, 'label', { class: 'label-in', placeholder: 'e.g. Loaf, 4 pack, 6 pack variety', maxlength: 80, aria: 'Size or option name' }),
          h('span', { class: 'price-wrap' }, '$', textIn(opt, 'price', { inputmode: 'decimal', placeholder: '0.00', aria: 'Price' })),
          h('button', { class: 'btn small danger x', type: 'button', 'aria-label': 'Remove this size', title: 'Remove',
            onclick: () => { item.options.splice(oi, 1); markDirty(); renderEditor(); } }, '×'))),
        h('button', { class: 'btn small secondary', type: 'button', style: 'margin-top:8px',
          onclick: () => { item.options.push({ id: uid('o'), label: '', price: '' }); markDirty(); renderEditor(); } }, '+ Add size / price'),
        h('div', { class: 'item-actions' },
          h('button', { class: 'btn small secondary', type: 'button', disabled: idx === 0,
            onclick: () => move(idx, -1) }, '↑ Move up'),
          h('button', { class: 'btn small secondary', type: 'button', disabled: idx === items.length - 1,
            onclick: () => move(idx, 1) }, '↓ Move down'),
          h('button', { class: 'btn small secondary', type: 'button', onclick: () => duplicate(idx) }, 'Duplicate'),
          h('span', { class: 'spacer' }),
          h('button', { class: 'btn small danger', type: 'button', onclick: () => {
            if (!confirm('Remove "' + (item.name || 'this item') + '" from the menu?')) return;
            items.splice(idx, 1); markDirty(); renderEditor();
          } }, 'Remove item'))
      );
      return card;
    }

    // Which menus show this item, and where it's sold out.
    function availability(item, card) {
      const m = S.menu;
      const pickupName = m.pickupMode === 'weekly' ? Crust.DAYS[m.weekly.pickupDay] + ' pickup' : 'Pickup';
      const deliveryName = Crust.DAYS[m.delivery.weekly.pickupDay] + ' delivery';
      const note = h('p', { class: 'avail-note' });
      const paint = () => {
        const live = (item.onPickup && !item.soldOutPickup) || (item.onDelivery && !item.soldOutDelivery);
        card.classList.toggle('is-soldout', !live);
        note.textContent = !item.onPickup && !item.onDelivery
          ? 'Hidden from both menus. Customers won\'t see it until you check a menu above.'
          : !live ? 'Sold out everywhere it\'s offered.' : '';
        note.hidden = !note.textContent;
      };
      const cb = (prop, label) => {
        const el = h('input', { type: 'checkbox', checked: !!item[prop], 'aria-label': label });
        el.addEventListener('change', () => { item[prop] = el.checked; markDirty(); paint(); });
        return el;
      };
      const name = item.name || 'this item';
      const box = h('div', { class: 'field' },
        h('table', { class: 'avail' },
          h('thead', {}, h('tr', {}, h('th', {}), h('th', { scope: 'col' }, pickupName), h('th', { scope: 'col' }, deliveryName))),
          h('tbody', {},
            h('tr', {}, h('th', { scope: 'row' }, 'On this menu'),
              h('td', {}, cb('onPickup', name + ' on the ' + pickupName + ' menu')),
              h('td', {}, cb('onDelivery', name + ' on the ' + deliveryName + ' menu'))),
            h('tr', {}, h('th', { scope: 'row' }, 'Sold out'),
              h('td', {}, cb('soldOutPickup', name + ' sold out for ' + pickupName)),
              h('td', {}, cb('soldOutDelivery', name + ' sold out for ' + deliveryName))))),
        note);
      paint();
      return box;
    }

    function move(idx, dir) {
      const items = S.menu.items;
      const [it] = items.splice(idx, 1);
      items.splice(idx + dir, 0, it);
      markDirty(); renderEditor();
      document.getElementById('item-' + it.id).scrollIntoView({ block: 'center' });
    }

    function duplicate(idx) {
      const copy = JSON.parse(JSON.stringify(S.menu.items[idx]));
      copy.id = uid('i');
      copy.name = (copy.name || 'Item') + ' (copy)';
      copy.options.forEach(o => { o.id = uid('o'); });
      S.menu.items.splice(idx + 1, 0, copy);
      markDirty(); renderEditor();
      document.getElementById('item-' + copy.id).scrollIntoView({ block: 'center' });
    }

    function addItem() {
      const it = { id: uid('i'), name: '', description: '', badge: '', image: '',
                   onPickup: true, onDelivery: true, soldOutPickup: false, soldOutDelivery: false,
                   options: [{ id: uid('o'), label: '', price: '' }] };
      S.menu.items.push(it);
      markDirty(); renderEditor();
      const card = document.getElementById('item-' + it.id);
      card.scrollIntoView({ block: 'center' });
      card.querySelector('input.name-input').focus();
    }

    /* ---------- Publish ---------- */

    function problems() {
      const m = S.menu, out = [];
      if (m.ordersOpen && m.pickupMode === 'weekly' && !Crust.nextPickup(m.weekly)) {
        out.push('There is no upcoming pickup date, so customers will see "no pickup dates open".');
      }
      if (m.delivery.enabled && !Crust.nextPickup(m.delivery.weekly)) {
        out.push('There is no upcoming work delivery date, so coworkers will see "no delivery dates open".');
      }
      if (m.ordersOpen && m.pickupMode === 'list' && !m.pickupOptions.some(p => String(p).trim())) {
        out.push('There are no pickup options, so customers won\'t be asked when they\'re picking up.');
      }
      m.items.forEach((it, i) => {
        const name = String(it.name || '').trim() || 'Item #' + (i + 1);
        if (!String(it.name || '').trim()) out.push('Item #' + (i + 1) + ' has no name.');
        if (!it.options.length) out.push(name + ' has no sizes/prices, so customers can\'t order it.');
        it.options.forEach(o => {
          const p = String(o.price).replace(/[$,\s]/g, '');
          if (p === '' || !isFinite(Number(p)) || Number(p) < 0) out.push(name + ': "' + (o.label || 'a size') + '" needs a valid price.');
          else if (Number(p) === 0) out.push(name + ': "' + (o.label || 'a size') + '" is priced at $0.');
        });
      });
      return out;
    }

    async function publish() {
      const p = problems();
      if (p.length && !confirm('Please check before publishing:\n\n• ' + p.join('\n• ') + '\n\nPublish anyway?')) return;
      const btn = document.getElementById('publish-btn');
      btn.disabled = true; btn.textContent = 'Publishing…';
      try {
        const d = await adminCall({ action: 'adminPublish', menu: S.menu });
        S.menu = d.menu; S.dirty = false;
        renderEditor();
        toast('Published. The order page now shows this menu.');
      } catch (e) {
        if (document.getElementById('publish-btn')) { btn.textContent = 'Publish'; updateStatus(); toast(e.message, true); }
      }
    }

    function lock() {
      if (S.dirty && !confirm('You have unpublished changes. Lock the editor and lose them?')) return;
      S.dirty = false; S.pw = null; writePw(null);
      showLogin('Editor locked.');
    }

    /* ---------- Saved menus ---------- */

    function savedCard() {
      const nameIn = h('input', { type: 'text', placeholder: 'e.g. Fall, Christmas, Valentine\'s', maxlength: 60, 'aria-label': 'Name for this saved menu' });
      const select = S.saved.length
        ? h('select', { 'aria-label': 'Saved menus' }, S.saved.map(s => h('option', { value: s.name },
            s.name + (s.saved ? ' (saved ' + new Date(s.saved).toLocaleDateString() + ')' : ''))))
        : null;

      return h('section', { class: 'card' },
        h('p', { class: 'muted', style: 'margin-top:0' },
          'Keep seasonal menus here and bring them back later. Saving or opening a menu does not change the live order page until you press Publish.'),
        select
          ? h('div', {},
              h('label', { class: 'field' }, 'Saved menus', select),
              h('div', { class: 'btn-row', style: 'margin-top:0;margin-bottom:18px' },
                h('button', { class: 'btn small secondary', type: 'button', onclick: () => openSaved(select.value) }, 'Open in editor'),
                h('button', { class: 'btn small danger', type: 'button', onclick: () => deleteSaved(select.value) }, 'Delete')))
          : h('p', { class: 'muted' }, 'No saved menus yet.'),
        h('div', { class: 'row' },
          h('div', { class: 'grow' }, h('label', { class: 'field', style: 'margin:0' }, 'Save what\'s in the editor as', nameIn)),
          h('button', { class: 'btn small', type: 'button', onclick: () => saveAs(nameIn.value) }, 'Save'))
      );
    }

    async function saveAs(name) {
      name = String(name || '').trim();
      if (!name) return toast('Type a name for this menu first.', true);
      if (S.saved.some(s => s.name.toLowerCase() === name.toLowerCase()) &&
          !confirm('A saved menu called "' + name + '" already exists. Replace it?')) return;
      try {
        const d = await adminCall({ action: 'adminSaveAs', name, menu: S.menu });
        S.saved = d.saved;
        renderEditor();
        toast('Saved "' + name + '".');
      } catch (e) { toast(e.message, true); }
    }

    async function openSaved(name) {
      if (S.dirty && !confirm('Opening "' + name + '" replaces what\'s in the editor, and your unpublished changes will be lost. Continue?')) return;
      try {
        const d = await adminCall({ action: 'adminOpenSaved', name });
        S.menu = d.menu;
        renderEditor(); markDirty();
        window.scrollTo(0, 0);
        toast('Opened "' + name + '". Review it, then press Publish to make it live.');
      } catch (e) { toast(e.message, true); }
    }

    async function deleteSaved(name) {
      if (!confirm('Delete the saved menu "' + name + '"? This can\'t be undone.')) return;
      try {
        const d = await adminCall({ action: 'adminDeleteSaved', name });
        S.saved = d.saved;
        renderEditor();
        toast('Deleted "' + name + '".');
      } catch (e) { toast(e.message, true); }
    }

    window.addEventListener('beforeunload', (e) => {
      if (S.dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ---------- Start ---------- */
    (async function init() {
      if (!Crust.isConfigured()) {
        fill(root, h('div', { class: 'card error' },
          "This page isn't connected yet. Paste the Apps Script Web App URL into config.js."));
        return;
      }
      const saved = readPw();
      if (!saved) return showLogin();
      try { await loadEditor(saved); }
      catch (e) { showLogin(e.code === 'bad_password' ? '' : e.message); }
    })();
  })();
  </script>
</body>
</html>
